[package]
name = "stan-launcher"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs" # <--- ДОБАВИТЬ ВОТ ЭТУ СТРОКУ

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.13"
jni = "0.21"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.27"
egui_glow = "0.27"
glow = "0.13"

[profile.release]
lto = true
opt-level = "s"
strip = true
