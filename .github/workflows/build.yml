name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project Template
        run: |
          # Клонируем минимальный шаблон
          git clone https://github.com/androidthings/sample-empty.git temp_android
          # Копируем всю инфраструктуру (gradlew, gradle-wrapper.jar и т.д.)
          cp -r temp_android/* .
          cp -r temp_android/.gradle . || true
          
      - name: Fix Build Config
        run: |
          # Меняем ID приложения, чтобы не конфликтовало
          sed -i 's/com.example.androidthings.empty/com.stan.launcher/g' app/build.gradle
          # Удаляем старую активити и лэйауты из шаблона, чтобы они не мешали
          rm -rf app/src/main/java/com/example app/src/main/res/layout

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stan-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
